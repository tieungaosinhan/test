<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Supabase JSON Demo</title>
</head>
<body>
  <h1>Test Supabase Storage</h1>

  <form id="saveForm">
    <label>Nhập dữ liệu:</label><br>
    <input type="text" id="inputData" placeholder="Ví dụ: Hello Supabase">
    <button type="submit">Lưu JSON</button>
  </form>

  <button id="readBtn">Đọc lại JSON</button>

  <pre id="output"></pre>

  <!-- Dùng unpkg thay cho jsDelivr để tránh bị chặn -->
  <script src="https://unpkg.com/@supabase/supabase-js"></script>
  <script>
    // Thay bằng Project URL và Publishable (anon) key của bạn
    const SUPABASE_URL = "https://opmjnbgrtihvcznxzzji.supabase.co"; // ví dụ
    const SUPABASE_KEY = "sb_publishable_zdd5PDUq8UoIsR1I1LnFnw_iEefNew9";

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function saveJson(filename, obj) {
      const { error } = await client.storage
        .from('03060810') // đổi đúng tên bucket bạn đã tạo
        .upload(filename, new Blob([JSON.stringify(obj)], { type: 'application/json' }), {
          upsert: true
        });
      if (error) {
        document.getElementById("output").textContent = "Error: " + error.message;
      } else {
        document.getElementById("output").textContent = "Đã lưu " + filename;
      }
    }

    async function readJson(filename) {
      const { data, error } = await client.storage
        .from('json-bucket')
        .download(filename);
      if (error) {
        document.getElementById("output").textContent = "Error: " + error.message;
        return;
      }
      const text = await data.text();
      const obj = JSON.parse(text);
      document.getElementById("output").textContent = JSON.stringify(obj, null, 2);
    }

    document.getElementById("saveForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const val = document.getElementById("inputData").value;
      await saveJson("data.json", { message: val });
    });

    document.getElementById("readBtn").addEventListener("click", async () => {
      await readJson("data.json");
    });
  </script>
</body>
</html>
